<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <!-- Subtle Inner Glow -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Waveform Glow / Accent -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>

    <!-- Drop Shadow Filter for Bars -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#042F2E" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />

  <!-- Glass/Gloss Highlight on top edge -->
  <rect x="2" y="2" width="60" height="30" rx="16" fill="url(#glassGloss)" />

  <!-- Outer Border Ring for Crisp Visibility on Light & Dark Tabs -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Audio Waveform / Speech Fluency Bars (with soft drop shadow) -->
  <g filter="url(#shadow)" fill="#FFFFFF">
    <!-- Bar 1 -->
    <rect x="13" y="26" width="4.5" height="12" rx="2.25" />
    <!-- Bar 2 -->
    <rect x="21" y="19" width="4.5" height="26" rx="2.25" />
    <!-- Bar 3 (Center Key Peak) -->
    <rect x="29" y="13" width="5" height="38" rx="2.5" />
    <!-- Bar 4 -->
    <rect x="38" y="20" width="4.5" height="24" rx="2.25" />
    <!-- Bar 5 -->
    <rect x="46" y="27" width="4.5" height="10" rx="2.25" />
  </g>

  <!-- AI Intelligence Pulse Dot / Sparkle (Top-Right of Center) -->
  <circle cx="47" cy="15" r="3" fill="#FEF08A" />
  <circle cx="47" cy="15" r="1.5" fill="#FFFFFF" />
</svg>